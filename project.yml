name: AdhanApp
options:
  bundleIdPrefix: com.shariq.adhan
  deploymentTarget:
    iOS: "18.0"
  xcodeVersion: "18.0"
  groupSortPosition: top
  generateEmptyDirectories: true
  minimumXcodeGenVersion: "2.40.0"

settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    IPHONEOS_DEPLOYMENT_TARGET: "18.0"
    CODE_SIGN_STYLE: Automatic
    CODE_SIGN_IDENTITY: "Apple Development"

packages:
  Adhan:
    url: https://github.com/batoulapps/adhan-swift
    from: "1.3.0"

targets:
  AdhanApp:
    type: application
    platform: iOS
    deploymentTarget: "18.0"
    sources:
      - path: AdhanApp
      - path: AppIcon.icon
        type: file
        buildPhase: resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.shariq.adhan
        INFOPLIST_FILE: AdhanApp/Info.plist
        CODE_SIGN_ENTITLEMENTS: AdhanApp/AdhanApp.entitlements
        PRODUCT_NAME: "Adhan alarm app"
        MARKETING_VERSION: "1.0.1"
        CURRENT_PROJECT_VERSION: "5"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        SWIFT_EMIT_LOC_STRINGS: "YES"
        GENERATE_INFOPLIST_FILE: false
    dependencies:
      - package: Adhan
      - target: AdhanWidgets
    scheme:
      testTargets:
        - AdhanAppTests
      gatherCoverageData: true

  AdhanWidgets:
    type: app-extension
    platform: iOS
    deploymentTarget: "18.0"
    sources:
      - path: AdhanWidgets
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.shariq.adhan.widgets
        INFOPLIST_FILE: AdhanWidgets/Info.plist
        CODE_SIGN_ENTITLEMENTS: AdhanWidgets/AdhanWidgets.entitlements
        PRODUCT_NAME: AdhanWidgets
        MARKETING_VERSION: "1.0.1"
        CURRENT_PROJECT_VERSION: "5"
        GENERATE_INFOPLIST_FILE: false
        CODE_SIGN_STYLE: Automatic
        CODE_SIGN_IDENTITY: "Apple Development"
    dependencies:
      - package: Adhan

  AdhanAppTests:
    type: bundle.unit-test
    platform: iOS
    deploymentTarget: "18.0"
    sources:
      - path: AdhanAppTests
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.shariq.adhan.tests
        GENERATE_INFOPLIST_FILE: true
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/Adhan alarm app.app/$(BUNDLE_EXECUTABLE_FOLDER_PATH)/Adhan alarm app"
        BUNDLE_LOADER: "$(TEST_HOST)"
    dependencies:
      - target: AdhanApp

  AdhanAppUITests:
    type: bundle.ui-testing
    platform: iOS
    deploymentTarget: "18.0"
    sources:
      - path: AdhanAppUITests
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.shariq.adhan.uitests
        GENERATE_INFOPLIST_FILE: true
    dependencies:
      - target: AdhanApp
